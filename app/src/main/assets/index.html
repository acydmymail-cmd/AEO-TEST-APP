<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AEO Test</title>
<style>body{font-family:Arial;background:#f1f5f9;color:#10223b;margin:0;padding:20px}header{background:#184e77;color:white;padding:20px;border-radius:16px;text-align:center}h1{margin:4px}button{border:0;background:#fff;color:#184e77;padding:14px;margin:7px;border-radius:12px;font-size:16px;box-shadow:0 2px 7px #ccd}section{background:white;padding:15px;border-radius:14px;margin-top:16px} .subjects{display:flex;flex-wrap:wrap;justify-content:center}</style></head><body>
<header><h1>AEO TEST</h1><p>Classes 3, 4 & 5 • Learning and Practice</p></header>
<section><h2>Select Class</h2><div class="subjects"><button onclick="showClass(3)">Class 3</button><button onclick="showClass(4)">Class 4</button><button onclick="showClass(5)">Class 5</button></div></section>
<section id="content"><h2>Welcome</h2><p>Select a class to view subjects.</p></section>
<script>function showClass(c){document.getElementById('content').innerHTML='<h2>Class '+c+'</h2><p>Select subject for SLO practice:</p><div class="subjects"><button onclick="practice(\'English\', '+c+')">English</button><button onclick="practice(\'Urdu\', '+c+')">Urdu</button><button onclick="practice(\'Math\', '+c+')">Math</button><button onclick="test('+c+')">Monthly Test (9 Questions)</button></div><div id="detail"></div>'}function practice(s,c){document.getElementById('detail').innerHTML='<h3>Class '+c+' • '+s+'</h3><p>SLO practice content will be added in monthly update.</p>'}function test(c){document.getElementById('detail').innerHTML='<h3>Class '+c+' Monthly Test</h3><p>9 questions: 3 English, 3 Urdu, 3 Math. Student selection and question bank will be added next.</p>'}</script></body></html>
